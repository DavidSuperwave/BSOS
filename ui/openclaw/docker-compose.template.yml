# Template for per-company container deployment
# Generated by /api/companies/[id]/provision
# Deployed to /opt/openclaw/{company_slug}/ on the droplet
#
# Placeholders replaced at provisioning time:
#   {{IMAGE}}           — GHCR image (e.g. ghcr.io/user/repo/openclaw:main)
#   {{COMPANY_SLUG}}    — URL-safe company identifier
#   {{PORT}}            — Allocated host port (18790-18850)
#   {{ENV_VARS}}        — Rendered environment block

version: "3.8"

services:
  openclaw:
    image: "{{IMAGE}}"
    container_name: "openclaw-{{COMPANY_SLUG}}"
    restart: unless-stopped
    ports:
      - "{{PORT}}:18789"
    environment:
{{ENV_VARS}}
    volumes:
      - openclaw-data:/data
      - ./agents:/data/agents
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "18789"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  openclaw-data:
